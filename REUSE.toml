version = 1
SPDX-PackageName = "slicer-profiles"
SPDX-PackageDownloadLocation = "https://github.com/ESchuderer/slicer-profiles"

# Code, docs, the docs site and the manifest schema: ISC.
[[annotations]]
path = [
    "src/**",
    "scripts/**",
    "tests/**",
    ".github/**",
    "docs/**",
    "schemas/**",
    "site/src/**",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    "upstream.lock.toml",
    ".python-version",
    ".gitignore",
    "REUSE.toml",
    "site/package.json",
    "site/package-lock.json",
    "site/docusaurus.config.js",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ESchuderer"
SPDX-License-Identifier = "ISC"

# Own data: the tables and the generated presets (golden files, licensed like the release zip). Values
# taken from maker data sheets are cited as third-party facts, and the stock parents are named, not copied.
[[annotations]]
path = ["config/**", "tests/golden/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 ESchuderer"
SPDX-License-Identifier = "CC0-1.0"
