[project]
name = "slicer-profiles"
version = "0.1.0"
description = "Tuned print, filament and printer presets for OrcaSlicer, Bambu Studio, QIDI Studio and Snapmaker Orca."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "basedpyright==1.40.2",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "shellcheck-py==0.11.0.1",
    "typos==1.51.1",
    "zizmor==1.31.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # copyright and license notices are checked by `reuse lint`
    "D203",   # D211 (no blank line before a class docstring) is the one kept
    "D213",   # D212 (summary on the first docstring line) is the one kept
    "T201",   # the generators are command-line scripts that report with print
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-args = 5
max-statements = 50
max-positional-args = 5

# Typing plan for the modules that predate the gates (v0.1.0). Each one leaves both lists below
# when the roadmap item that rewrites it lands; new modules are never added:
#   gen_*.py                         N6 and N7 (generator on pinned upstream trees)
# The ignored rule families are annotations (ANN), docstrings (D), pathlib (PTH) and the open() and
# shebang findings that the same rewrite removes.
[tool.ruff.lint.per-file-ignores]
"src/{gen_process,gen_filament,gen_machine,gen_bambu,gen_snapmaker}.py" = [
    "ANN", "D", "PTH", "SIM115", "E501", "EXE001", "PLW2901", "PLR2004",
]
"tests/**" = [
    "S101",    # pytest asserts
    "D103",    # the test name states the behavior
    "INP001",  # tests are not a package
    "PLR2004", # expected values in tests
]

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.12"
include = ["src", "tests"]
extraPaths = ["src"]
# The legacy modules of the typing plan above; the list only shrinks.
ignore = [
    "src/gen_process.py", "src/gen_filament.py",
    "src/gen_machine.py", "src/gen_bambu.py", "src/gen_snapmaker.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.typos.default]
locale = "en-us"

[tool.typos.files]
extend-exclude = ["tests/expected.sha256", "tests/models/*.stl", "uv.lock"]

[tool.typos.default.extend-identifiers]
extruder_colour = "extruder_colour" # slicer key name
