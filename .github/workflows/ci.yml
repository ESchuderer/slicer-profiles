name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Python compiles
        run: python3 -m compileall -q .
      - name: JSON is valid
        run: for f in config/filaments.json config/printers.example.json; do python3 -m json.tool "$f" >/dev/null; done
