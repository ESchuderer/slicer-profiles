# One entry per target slicer: the release the presets are built and tested for (newest stable only)
# and the stock profile tree it ships. The generators, the README table and the release manifest read
# their versions from here.
#   version         the app release
#   preset_version  the "version" written into every generated preset of that target
#   repository, tag, commit   where the stock profiles (resources/profiles) of that release live
